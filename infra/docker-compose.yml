# The isolated dev fence — mounts the ACTIVE worktree at /worktree and behaves as a
# brand-new machine: own HOME, own tmux, no published ports, builds land in the
# container's ~/.local/bin. `dev.sh iso` is the intended entry point; it sets
# PFM_DEV_WORKTREE to the checkout it runs from. See docs/dev/isolated-dev-foundation.md.
services:
  pfm-dev:
    build:
      context: .
      dockerfile: pfm-dev.Dockerfile
    image: professor-pfm-dev
    volumes:
      # Read-only by law: files are edited on the HOST; the container only builds
      # and tests. Build/test outputs land in the cache volumes and container-HOME,
      # never the tree — an in-container write to /worktree fails loudly.
      - ${PFM_DEV_WORKTREE:?set by dev.sh iso — the worktree to fence}:/worktree:ro
      - pfm-dev-gocache:/root/.cache/go-build
      - pfm-dev-gomod:/root/go/pkg/mod
    working_dir: /worktree
    environment:
      PFM_DEV_FENCE: "1"
      # root-vs-uid1000 dubious ownership + an unmounted worktree gitdir break `git`-shelling go builds; pfm reports version "dev", so no VCS stamp is lost.
      GOFLAGS: "-buildvcs=false"

volumes:
  pfm-dev-gocache:
  pfm-dev-gomod:
