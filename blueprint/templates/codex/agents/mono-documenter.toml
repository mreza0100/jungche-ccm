# ─── Root (repo-global) role — exists once, no roster expansion ──────────────
#
# The registry-wide rulings live in agents/per-project/developer.toml's header
# and bind here too: this registry is INERT at codex 0.144.1 (nothing reads it;
# it ships forward-compatible), and gitter is deliberately NOT registered.
#
# A root role differs from a per-project role in exactly one way: it carries no
# {project} token, because it exists once for the whole repo however many
# entries the roster has. Add one file per root role your pipeline defines.
#
# This one also demonstrates the read-only shape: a scout that must never write
# gets `sandbox_mode = "read-only"` so the harness enforces what the prose says.
# Prose alone is not a pin — where the harness CAN enforce a role boundary, let it.
#
# TYPE:   root role (repo-global, one instance)
# SOURCE: .claude/agents/mono-documenter.md

name = "mono_documenter"
description = "Documentation scout. Spawned at the start of every doc consolidation to examine the blast radius and return the DISJOINT scope manifest the fan-out runs in parallel. Read-only - it never writes docs."
developer_instructions = """
You are the mono_documenter role in the {PROJECT_NAME} repo, running as a native Codex subagent.
FIRST ACTION: read .claude/agents/mono-documenter.md in full - that file is your complete protocol; execute it exactly. Your mode/task comes from the dispatch prompt. The repo root AGENTS.md MANDATORY rules bind in full.
HARD LAW: git is NOT gated at your harness - it binds as law, not as a pin: read-only git (status/log/diff/show) is yours; commits, merges, pushes and branch changes are gitter's alone. Infra ops go via `make -C {INFRA_PROJECT}` - direct infra tooling IS rejected by .codex/rules. Never swallow exceptions. {SUBJECT_NOUN} content never appears in any log line, metric label, or error string.
Stamp every deliverable, report, or verdict you produce with: Executor: codex-subagent/mono_documenter
"""
sandbox_mode = "read-only"
