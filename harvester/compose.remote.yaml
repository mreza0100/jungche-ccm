# Remote harvester — Streamable HTTP for a claude.ai custom connector.
#
# Two locks, deliberately:
#   1. Both ports bind to 127.0.0.1 ONLY. Public reach for the external gateway (8081) comes from a
#      Tailscale Funnel pointed at that port, so no firewall hole is opened and `ufw` stays
#      default-deny. A Docker `-p 0.0.0.0:` here would be internet-facing DESPITE ufw — Docker
#      writes its own iptables rules. The internal gateway (8082) is loopback-only for the same
#      reason, AND it must NEVER be handed to the tunnel — it carries no authentication by design.
#   2. The container gets NO host bind mounts. Local reads are additionally confined to the cache
#      root at the application layer (`detect.LOCAL_ROOTS`), so a remote caller can read harvester's
#      own artifacts and nothing else — and the container has nothing else to read anyway.
#
# Cache and auth state live in NAMED volumes, not host paths. They are separate volumes on purpose:
# the cache is remotely readable through `fetch`, so the credential store must not sit inside it.
#
# Secrets come from an env file that is never committed:
#   HARVESTER_AUTH_PASSPHRASE=...   # what you type on the consent screen
#   HARVESTER_STATIC_TOKEN=...      # optional: fixed bearer for curl / Claude Code
#   HARVESTER_PUBLIC_URL=https://<node>.<tailnet>.ts.net
#
# Run:  docker compose -f compose.remote.yaml --env-file .env.remote up -d --build

services:
  harvester:
    build:
      context: .
      dockerfile: Dockerfile
    image: harvester-remote:latest
    container_name: harvester-remote
    restart: unless-stopped
    command:
      - --transport=http
      - --host=0.0.0.0          # inside the container; the PUBLISHED port is loopback-only below
      - --port=8081
      - --public-url=${HARVESTER_PUBLIC_URL}
      # 0.0.0.0 here is correct too — it's the bind address INSIDE the container. The published
      # port below is loopback-bound on the host, which is what actually restricts reach. The
      # internal gateway only actually starts if the external gateway above has credentials.
      - --internal-host=0.0.0.0
      - --internal-port=8082
    environment:
      HARVESTER_AUTH_PASSPHRASE: ${HARVESTER_AUTH_PASSPHRASE:-}
      HARVESTER_STATIC_TOKEN: ${HARVESTER_STATIC_TOKEN:-}
      HARVESTER_CONTACT_EMAIL: ${HARVESTER_CONTACT_EMAIL:-}
      # claude.ai truncates a tool result at ~150k chars; stay under it so the cache file, not the
      # transport, is what holds the overflow.
      HARVESTER_MAX_INLINE_CHARS: ${HARVESTER_MAX_INLINE_CHARS:-120000}
      HARVESTER_CACHE_TTL: ${HARVESTER_CACHE_TTL:-86400}
      SEARXNG_URL: ${SEARXNG_URL:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    ports:
      - "127.0.0.1:8081:8081"
      # Internal gateway: unauthenticated by design, for local/tailnet callers only. Loopback-bound
      # like the external port above — NEVER point a tunnel (Funnel/Cloudflare) at 8082.
      - "127.0.0.1:8082:8082"
    volumes:
      - harvester-cache:/app/.cache
      - harvester-state:/app/.harvester-state
    # Hardening: nothing here needs to write outside its volumes or gain privileges.
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # cold start imports the heavy converters (docling, pymupdf)

volumes:
  harvester-cache:
  harvester-state:
