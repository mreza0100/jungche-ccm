name: Installer end-to-end verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux installer e2e
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install checkout and e2e tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git tmux zsh

      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      - name: Run serial installer e2e
        shell: bash
        env:
          PFM_DEV_FENCE: "1"
          PFM_HARVESTPY_OFFLINE: "1"
        run: |
          set -euo pipefail
          export PFM_E2E_SOURCE_REPO="$GITHUB_WORKSPACE"
          export PFM_DEV_REPO_WORK_TREE="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PFM_DEV_REPO_GIT_DIR="$(git rev-parse --absolute-git-dir)"
          export PFM_DEV_REPO_GIT_DIR
          go -C pfm test -count=1 -tags e2e -p 1 ./e2e/...

  darwin:
    name: Darwin installer e2e
    runs-on: macos-14
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      - name: Install e2e tools
        run: brew install tmux

      - name: Run serial installer e2e
        env:
          PFM_DEV_FENCE: "1"
          PFM_HARVESTPY_OFFLINE: "1"
        run: |
          set -euo pipefail
          export PFM_E2E_SOURCE_REPO="$GITHUB_WORKSPACE"
          export PFM_DEV_REPO_WORK_TREE="$GITHUB_WORKSPACE"
          PFM_DEV_REPO_GIT_DIR="$(git rev-parse --absolute-git-dir)"
          export PFM_DEV_REPO_GIT_DIR
          go -C pfm test -count=1 -tags e2e -p 1 ./e2e/...
